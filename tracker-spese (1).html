<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Spese">
<meta name="theme-color" content="#ffffff">
<title>Tracker Spese</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  :root {
    --bg: #f5f5f0;
    --surface: #ffffff;
    --surface2: #f0efe9;
    --text: #1a1a18;
    --text2: #6b6b66;
    --border: rgba(0,0,0,0.1);
    --accent: #2563eb;
    --radius: 14px;
    --bottom-bar: 72px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111110;
      --surface: #1e1e1c;
      --surface2: #2a2a28;
      --text: #f0efe9;
      --text2: #888884;
      --border: rgba(255,255,255,0.1);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overscroll-behavior: none; }
  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 20px 12px; position: sticky; top: 0; z-index: 10; }
  .header h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
  .header p { font-size: 13px; color: var(--text2); margin-top: 2px; }
  .metrics { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; padding: 16px 16px 0; }
  .metric { background: var(--surface); border-radius: var(--radius); padding: 14px 12px; }
  .metric-label { font-size: 11px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .metric-val { font-size: 18px; font-weight: 700; letter-spacing: -0.5px; }
  .content { padding: 16px; padding-bottom: calc(var(--bottom-bar) + 16px); }
  .section-title { font-size: 13px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; margin: 20px 0 10px; }

  /* Form */
  .card { background: var(--surface); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 13px; color: var(--text2); margin-bottom: 6px; font-weight: 500; }
  .field input, .field select {
    width: 100%; padding: 12px 14px; border: 1px solid var(--border);
    border-radius: 10px; font-size: 16px; background: var(--surface2);
    color: var(--text); font-family: inherit; outline: none;
    -webkit-appearance: none; appearance: none;
  }
  .field input:focus, .field select:focus { border-color: var(--accent); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn-primary {
    width: 100%; padding: 15px; background: var(--accent); color: #fff;
    border: none; border-radius: 12px; font-size: 16px; font-weight: 600;
    cursor: pointer; font-family: inherit; margin-top: 4px;
    active: transform scale(0.98);
  }
  .btn-primary:active { opacity: 0.85; transform: scale(0.98); }

  /* Lista */
  .spesa-item {
    background: var(--surface); border-radius: var(--radius);
    padding: 14px 16px; margin-bottom: 8px;
    display: flex; align-items: center; gap: 12px;
  }
  .cat-icon { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
  .spesa-info { flex: 1; min-width: 0; }
  .spesa-desc { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .spesa-meta { font-size: 12px; color: var(--text2); margin-top: 2px; }
  .spesa-right { text-align: right; flex-shrink: 0; }
  .spesa-amount { font-size: 16px; font-weight: 700; }
  .btn-del { background: none; border: none; color: var(--text2); font-size: 20px; cursor: pointer; padding: 4px 0 0 8px; }
  .empty { text-align: center; padding: 40px 20px; color: var(--text2); font-size: 15px; }
  .empty-icon { font-size: 40px; margin-bottom: 10px; }

  /* Grafici */
  .chart-wrap { position: relative; width: 100%; height: 220px; margin: 10px 0 20px; }
  .cat-legend { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .cat-pill { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text2); background: var(--surface); padding: 5px 10px; border-radius: 20px; }
  .cat-dot { width: 8px; height: 8px; border-radius: 50%; }

  /* Filtri */
  .filter-row { display: flex; gap: 8px; margin-bottom: 12px; overflow-x: auto; padding-bottom: 4px; }
  .filter-btn { padding: 7px 14px; border: 1px solid var(--border); border-radius: 20px; font-size: 13px; background: var(--surface); color: var(--text2); white-space: nowrap; cursor: pointer; font-family: inherit; }
  .filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* Bottom nav */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--surface); border-top: 1px solid var(--border);
    display: flex; height: var(--bottom-bar);
    padding-bottom: env(safe-area-inset-bottom);
    z-index: 100;
  }
  .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border: none; background: none; color: var(--text2); font-size: 10px; cursor: pointer; font-family: inherit; padding-top: 8px; }
  .nav-btn.active { color: var(--accent); }
  .nav-icon { font-size: 22px; }
  .toast { position: fixed; bottom: calc(var(--bottom-bar) + 12px); left: 50%; transform: translateX(-50%); background: #1a1a18; color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 14px; z-index: 200; opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="header">
  <h1>💰 Le mie Spese</h1>
  <p id="header-date"></p>
</div>

<div class="metrics">
  <div class="metric"><div class="metric-label">Oggi</div><div class="metric-val" id="m-oggi">€0</div></div>
  <div class="metric"><div class="metric-label">Mese</div><div class="metric-val" id="m-mese">€0</div></div>
  <div class="metric"><div class="metric-label">Voci</div><div class="metric-val" id="m-count">0</div></div>
</div>

<!-- TAB AGGIUNGI -->
<div id="tab-aggiungi" class="content">
  <div class="section-title">Nuova spesa</div>
  <div class="card">
    <div class="row2">
      <div class="field">
        <label>Importo (€)</label>
        <input type="number" id="f-importo" placeholder="0,00" inputmode="decimal" step="0.01" min="0">
      </div>
      <div class="field">
        <label>Data</label>
        <input type="date" id="f-data">
      </div>
    </div>
    <div class="field">
      <label>Categoria</label>
      <select id="f-cat">
        <option value="cibo">🍕 Cibo & Ristoranti</option>
        <option value="spesa">🛒 Spesa</option>
        <option value="trasporti">🚇 Trasporti</option>
        <option value="salute">💊 Salute</option>
        <option value="svago">🎬 Svago</option>
        <option value="abbigliamento">👕 Abbigliamento</option>
        <option value="casa">🏠 Casa</option>
        <option value="tech">💻 Tech</option>
        <option value="altro">📦 Altro</option>
      </select>
    </div>
    <div class="field">
      <label>Descrizione (opzionale)</label>
      <input type="text" id="f-desc" placeholder="es. Pranzo con colleghi">
    </div>
    <button class="btn-primary" onclick="aggiungiSpesa()">+ Aggiungi spesa</button>
  </div>
</div>

<!-- TAB LISTA -->
<div id="tab-lista" class="content" style="display:none">
  <div class="filter-row" id="filtri-periodo">
    <button class="filter-btn" onclick="setFiltro('oggi')">Oggi</button>
    <button class="filter-btn" onclick="setFiltro('settimana')">Settimana</button>
    <button class="filter-btn active" onclick="setFiltro('mese')">Questo mese</button>
    <button class="filter-btn" onclick="setFiltro('tutto')">Tutto</button>
  </div>
  <div id="lista-spese"></div>
</div>

<!-- TAB GRAFICI -->
<div id="tab-grafici" class="content" style="display:none">
  <div class="section-title">Per categoria — mese corrente</div>
  <div class="cat-legend" id="cat-legend"></div>
  <div class="chart-wrap"><canvas id="chart-cat" role="img" aria-label="Spese per categoria mese corrente"></canvas></div>
  <div class="section-title">Ultimi 7 giorni</div>
  <div class="chart-wrap"><canvas id="chart-giorni" role="img" aria-label="Spese ultimi 7 giorni"></canvas></div>
</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <button class="nav-btn active" id="nav-aggiungi" onclick="showTab('aggiungi')">
    <span class="nav-icon">➕</span><span>Aggiungi</span>
  </button>
  <button class="nav-btn" id="nav-lista" onclick="showTab('lista')">
    <span class="nav-icon">📋</span><span>Lista</span>
  </button>
  <button class="nav-btn" id="nav-grafici" onclick="showTab('grafici')">
    <span class="nav-icon">📊</span><span>Grafici</span>
  </button>
</div>

<div class="toast" id="toast"></div>

<script>
const CAT_COLORS = { cibo:'#e05c2a', spesa:'#16a374', trasporti:'#2563eb', salute:'#d14f7c', svago:'#7c3aed', abbigliamento:'#d97706', casa:'#4d8c1a', tech:'#0891b2', altro:'#6b7280' };
const CAT_LABELS = { cibo:'Cibo & Ristoranti', spesa:'Spesa', trasporti:'Trasporti', salute:'Salute', svago:'Svago', abbigliamento:'Abbigliamento', casa:'Casa', tech:'Tech', altro:'Altro' };
const CAT_EMOJI = { cibo:'🍕', spesa:'🛒', trasporti:'🚇', salute:'💊', svago:'🎬', abbigliamento:'👕', casa:'🏠', tech:'💻', altro:'📦' };
const CAT_BG = { cibo:'#fdeee6', spesa:'#e0f7ef', trasporti:'#e8effd', salute:'#fce8f0', svago:'#ede9fe', abbigliamento:'#fef3e2', casa:'#edf5e0', tech:'#e0f4f8', altro:'#f3f4f6' };

let spese = [];
let filtro = 'mese';
let chartCat = null, chartGiorni = null;

function oggi() { return new Date().toISOString().slice(0,10); }

function load() {
  try { spese = JSON.parse(localStorage.getItem('spese_app') || '[]'); } catch(e) { spese = []; }
  const d = new Date();
  document.getElementById('header-date').textContent = d.toLocaleDateString('it-IT', {weekday:'long', day:'numeric', month:'long'});
  document.getElementById('f-data').value = oggi();
  updateMetrics();
}

function save() { localStorage.setItem('spese_app', JSON.stringify(spese)); }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function showTab(t) {
  ['aggiungi','lista','grafici'].forEach(id => {
    document.getElementById('tab-'+id).style.display = id===t ? '' : 'none';
    document.getElementById('nav-'+id).classList.toggle('active', id===t);
  });
  if (t==='lista') renderLista();
  if (t==='grafici') renderGrafici();
}

function aggiungiSpesa() {
  const imp = parseFloat(document.getElementById('f-importo').value);
  const data = document.getElementById('f-data').value;
  const cat = document.getElementById('f-cat').value;
  const desc = document.getElementById('f-desc').value.trim();
  if (!imp || imp <= 0) { showToast('⚠️ Inserisci un importo valido'); return; }
  if (!data) { showToast('⚠️ Seleziona una data'); return; }
  spese.push({ id: Date.now(), importo: imp, data, cat, desc: desc || CAT_LABELS[cat] });
  spese.sort((a,b) => b.data.localeCompare(a.data));
  save(); updateMetrics();
  document.getElementById('f-importo').value = '';
  document.getElementById('f-desc').value = '';
  showToast('✅ Spesa aggiunta!');
}

function eliminaSpesa(id) {
  if (!confirm('Eliminare questa spesa?')) return;
  spese = spese.filter(s => s.id !== id);
  save(); updateMetrics(); renderLista();
}

function updateMetrics() {
  const og = oggi(), mese = og.slice(0,7);
  document.getElementById('m-oggi').textContent = '€' + spese.filter(s=>s.data===og).reduce((a,s)=>a+s.importo,0).toFixed(2);
  document.getElementById('m-mese').textContent = '€' + spese.filter(s=>s.data.startsWith(mese)).reduce((a,s)=>a+s.importo,0).toFixed(2);
  document.getElementById('m-count').textContent = spese.length;
}

function setFiltro(f) {
  filtro = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  renderLista();
}

function filtraPeriodo(s) {
  const og = oggi();
  if (filtro==='oggi') return s.data===og;
  if (filtro==='settimana') { const d=new Date(); d.setDate(d.getDate()-6); return s.data>=d.toISOString().slice(0,10); }
  if (filtro==='mese') return s.data.startsWith(og.slice(0,7));
  return true;
}

function renderLista() {
  const filtered = spese.filter(filtraPeriodo);
  const el = document.getElementById('lista-spese');
  if (!filtered.length) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">🧾</div>Nessuna spesa trovata</div>';
    return;
  }
  const totale = filtered.reduce((a,s)=>a+s.importo,0);
  el.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding:0 2px"><span style="font-size:13px;color:var(--text2)">${filtered.length} voci</span><span style="font-size:16px;font-weight:700">Totale: €${totale.toFixed(2)}</span></div>` +
    filtered.map(s => `
    <div class="spesa-item">
      <div class="cat-icon" style="background:${CAT_BG[s.cat]}">${CAT_EMOJI[s.cat]}</div>
      <div class="spesa-info">
        <div class="spesa-desc">${s.desc}</div>
        <div class="spesa-meta">${CAT_LABELS[s.cat]} · ${s.data.split('-').reverse().join('/')}</div>
      </div>
      <div class="spesa-right">
        <div class="spesa-amount">€${s.importo.toFixed(2)}</div>
      </div>
      <button class="btn-del" onclick="eliminaSpesa(${s.id})" aria-label="Elimina">🗑</button>
    </div>`).join('');
}

function renderGrafici() {
  const mese = oggi().slice(0,7);
  const speseMese = spese.filter(s=>s.data.startsWith(mese));
  const perCat = {};
  speseMese.forEach(s => { perCat[s.cat]=(perCat[s.cat]||0)+s.importo; });
  const cats = Object.keys(perCat).sort((a,b)=>perCat[b]-perCat[a]);

  document.getElementById('cat-legend').innerHTML = cats.map(c =>
    `<div class="cat-pill"><div class="cat-dot" style="background:${CAT_COLORS[c]}"></div>${CAT_LABELS[c]} <strong>€${perCat[c].toFixed(2)}</strong></div>`
  ).join('');

  if (chartCat) chartCat.destroy();
  const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const gridColor = isDark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.06)';
  const textColor = isDark ? '#888884' : '#6b6b66';
  chartCat = new Chart(document.getElementById('chart-cat'), {
    type: 'bar',
    data: { labels: cats.map(c=>CAT_LABELS[c]), datasets: [{ data: cats.map(c=>parseFloat(perCat[c].toFixed(2))), backgroundColor: cats.map(c=>CAT_COLORS[c]), borderRadius: 6 }] },
    options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{
      x:{ticks:{color:textColor,font:{size:10},maxRotation:30,autoSkip:false},grid:{color:gridColor}},
      y:{ticks:{color:textColor,callback:v=>'€'+v},grid:{color:gridColor}}
    }}
  });

  const days = [];
  for (let i=6;i>=0;i--) { const d=new Date(); d.setDate(d.getDate()-i); days.push(d.toISOString().slice(0,10)); }
  const dayTot = days.map(d=>parseFloat(spese.filter(s=>s.data===d).reduce((a,s)=>a+s.importo,0).toFixed(2)));
  const dayLabels = days.map(d=>{ const [,m,g]=d.split('-'); return g+'/'+m; });

  if (chartGiorni) chartGiorni.destroy();
  chartGiorni = new Chart(document.getElementById('chart-giorni'), {
    type:'line',
    data:{ labels:dayLabels, datasets:[{ data:dayTot, borderColor:'#2563eb', backgroundColor:'rgba(37,99,235,0.08)', fill:true, tension:0.3, pointRadius:5, pointBackgroundColor:'#2563eb', pointBorderColor:'#fff', pointBorderWidth:2 }] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{
      x:{ticks:{color:textColor},grid:{color:gridColor}},
      y:{beginAtZero:true,ticks:{color:textColor,callback:v=>'€'+v},grid:{color:gridColor}}
    }}
  });
}

load();
</script>
</body>
</html>
